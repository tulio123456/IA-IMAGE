<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oficina de Imagens Web</title>
<link rel="stylesheet" href="/style.css">
<header><div><h1>Oficina de Imagens</h1><p>Geração no navegador com SD-Turbo.</p></div></header>
<main>
<form id="form">
<h2>Composição</h2>
<label>Prompt<textarea id="prompt" required maxlength="2000" placeholder="Photograph of a quiet coastal town at dawn, natural light, 35mm film"></textarea></label>
<label>Semente<input id="seed" type="number" min="0" max="4294967295" placeholder="Aleatória"></label>
<p id="engine" role="status">Verificando WebGPU…</p>
<p>A primeira geração baixa cerca de 2,3 GB.</p>
<button class="primary" id="generate" disabled>Gerar imagem</button>
</form>
<section aria-labelledby="result-title">
<h2 id="result-title">Resultado</h2>
<div class="stage"><p id="status" role="status">A imagem de 512 × 512 aparecerá aqui.</p><img id="image" alt="Imagem gerada pelo navegador" hidden></div>
<div class="result" id="result" hidden><a class="download" id="download" download="oficina.png">Baixar PNG</a><span id="info"></span></div>
</section>
</main>
<script type="module" src="/main.js"></script>
</html>
